name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ORKOSI_API_URL: ${{ vars.ORKOSI_API_URL || 'https://api.orkosi.com/v1/deploy' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest || [ $? -eq 5 ]

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Orkosi
        env:
          ORKOSI_API_TOKEN: ${{ secrets.ORKOSI_API_TOKEN }}
          ORKOSI_PROJECT_ID: ${{ secrets.ORKOSI_PROJECT_ID }}
          ORKOSI_API_URL: ${{ vars.ORKOSI_API_URL || 'https://api.orkosi.com/v1/deploy' }}
        run: |
          echo "::group::Orkosi Deployment"
          echo "Deploying commit ${GITHUB_SHA} to project ${ORKOSI_PROJECT_ID}"
          HTTP_CODE=$(curl -sS --connect-timeout 10 --max-time 60 -o body.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${ORKOSI_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"project_id\":\"${ORKOSI_PROJECT_ID}\",\"commit\":\"${GITHUB_SHA}\",\"branch\":\"${GITHUB_REF_NAME}\"}" \
            "${ORKOSI_API_URL}") || {
              echo "::error::Orkosi API unreachable (curl exit $?)"
              echo "Rollback: re-run this workflow on a previous commit."
              exit 1
            }
          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat body.txt
          case "${HTTP_CODE}" in
            ''|*[!0-9]*)
              echo "::error::Orkosi API returned non-numeric status: ${HTTP_CODE}"
              echo "Rollback: re-run this workflow on a previous commit."
              exit 1
              ;;
          esac
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "::notice::Deployment accepted by Orkosi (HTTP ${HTTP_CODE})"
          else
            echo "::error::Orkosi API returned HTTP ${HTTP_CODE}"
            echo "Rollback: re-run this workflow on a previous commit."
            exit 1
          fi
          echo "::endgroup::"
