<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing — Byoc FastAPI Alembic r5c</title>
<style>
  :root {
    --brand-primary: #B45309;
    --brand-accent: #10B981;
    --brand-bg: #0f0f0f;
    --brand-surface: #1a1a1a;
    --brand-text: #e0e0e0;
    --brand-text-muted: #888;
    --brand-text-on-primary: #fff;
    --brand-border: rgba(255,255,255,0.1);
    --font-heading: Inter, system-ui, -apple-system, sans-serif;
    --font-body: Inter, system-ui, -apple-system, sans-serif;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--brand-bg);
    color: var(--brand-text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
  }
  h1 {
    font-family: var(--font-heading);
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    color: var(--brand-text);
  }
  .subtitle {
    color: var(--brand-text-muted);
    font-size: 1rem;
    margin-bottom: 2rem;
  }

  /* plan-limits-table */
  .plan-limits-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--brand-surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--brand-border);
  }
  .plan-limits-table th,
  .plan-limits-table td {
    padding: 0.75rem 1rem;
    text-align: left;
    border-bottom: 1px solid var(--brand-border);
    font-size: 0.9rem;
  }
  .plan-limits-table thead th {
    background: rgba(255,255,255,0.04);
    font-weight: 600;
    color: var(--brand-text);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .plan-limits-table tbody td:first-child {
    font-weight: 500;
    color: var(--brand-text);
  }
  .plan-limits-table .unlimited {
    color: var(--brand-accent);
    font-weight: 500;
  }
  .plan-limits-table .limit-value {
    color: var(--brand-text);
    font-variant-numeric: tabular-nums;
  }
  .plan-limits-table tbody tr:last-child td {
    border-bottom: none;
  }

  .checkout-section {
    margin-top: 2rem;
    padding: 2rem;
    background: var(--brand-surface);
    border: 1px solid var(--brand-border);
    border-radius: var(--radius);
  }
  .checkout-section h2 {
    font-family: var(--font-heading);
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
  }
  .checkout-section p {
    color: var(--brand-text-muted);
    font-size: 0.9rem;
  }

  .loading, .error, .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--brand-text-muted);
    font-size: 0.95rem;
  }
  .error {
    color: #e74c3c;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Pricing</h1>
  <p class="subtitle">Choose the plan that fits your needs.</p>

  <div id="plan-limits-table"></div>

  <div class="checkout-section">
    <h2>Ready to upgrade?</h2>
    <p>Select a plan and proceed to checkout.</p>
  </div>
</div>

<script>
(function() {
  var container = document.getElementById('plan-limits-table');

  fetch('/api/plan-limits')
    .then(function(res) {
      if (!res.ok) throw new Error('Failed to load plan limits');
      return res.json();
    })
    .then(function(data) {
      if (!data || !data.features || !data.features.length || !data.plans || !data.plans.length) {
        container.innerHTML = '<div class="empty">No plans available.</div>';
        return;
      }
      renderTable(container, data.features, data.plans);
    })
    .catch(function(err) {
      container.innerHTML = '<div class="error">Unable to load plan information.</div>';
    });

  function renderTable(el, features, plans) {
    var table = document.createElement('table');
    table.className = 'plan-limits-table';

    // thead
    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    var thFeature = document.createElement('th');
    thFeature.textContent = 'Feature';
    headerRow.appendChild(thFeature);

    plans.forEach(function(p) {
      var th = document.createElement('th');
      th.textContent = p.name || p.plan;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // tbody
    var tbody = document.createElement('tbody');
    features.forEach(function(f) {
      var tr = document.createElement('tr');
      var tdLabel = document.createElement('td');
      tdLabel.textContent = f.label;
      tr.appendChild(tdLabel);

      plans.forEach(function(p) {
        var td = document.createElement('td');
        var limit = p.limits ? p.limits[f.key] : undefined;
        if (limit === null || limit === undefined) {
          td.innerHTML = '<span class="unlimited">Unlimited</span>';
        } else {
          td.innerHTML = '<span class="limit-value">' + limit + '</span>';
        }
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    el.innerHTML = '';
    el.appendChild(table);
  }
})();
</script>
</body>
</html>
