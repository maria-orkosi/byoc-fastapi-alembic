<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrations Graph - Byoc FastAPI Alembic r5c</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --color-accent: Highlight;
      --color-text: CanvasText;
      --color-bg: Canvas;
      --color-text-secondary: GrayText;
      --color-border: ButtonBorder;
      --color-error: crimson;
    }

    body {
      margin: 0;
      padding: 24px;
      background: Canvas;
      color: CanvasText;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: GrayText;
      font-size: 0.875rem;
      margin-bottom: 24px;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .controls button, .controls input {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid ButtonBorder;
      background: ButtonFace;
      color: ButtonText;
      font-family: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .controls button:hover {
      filter: brightness(1.15);
    }
    .controls input {
      width: 200px;
    }
    #graph {
      width: 100%;
      height: 70vh;
      border: 1px solid ButtonBorder;
      border-radius: 8px;
    }
    #rollback-result {
      margin: 16px auto;
      max-width: 600px;
      padding: 16px;
      border-radius: 8px;
      background: Canvas;
      border: 1px solid ButtonBorder;
      display: none;
    }
    #rollback-result h3 {
      margin-top: 0;
      font-size: 1rem;
    }
    #rollback-result pre {
      background: Canvas;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.8125rem;
    }
    .error {
      color: var(--color-error);
    }
  </style>
</head>
<body>
  <h1>Migrations Dependency Graph</h1>
  <p class="subtitle">Byoc FastAPI Alembic r5c</p>

  <div class="controls">
    <button id="btn-refresh">Refresh Graph</button>
    <input type="text" id="rollback-target" placeholder="Target revision (e.g. 0001)">
    <button id="btn-rollback">Compute Rollback</button>
  </div>

  <div id="graph"></div>
  <div id="rollback-result"></div>

  <script>
    /* GRAPH_DATA_PLACEHOLDER */
    var GRAPH_API = '/migrations/graph';
    var ROLLBACK_API = '/migrations/rollback/';

    /* -- CSS variable helpers -- */
    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function showError(msg) {
      var el = document.getElementById('rollback-result');
      el.style.display = 'block';
      el.textContent = '';
      var p = document.createElement('p');
      p.className = 'error';
      p.textContent = msg;
      el.appendChild(p);
    }

    /**
     * Compute a layered layout: x = topological generation, y = branch lane.
     */
    function computeLayout(data) {
      var nodes = data.nodes;
      var edges = data.edges;
      var children = {};
      var parents = {};
      nodes.forEach(function(n) { children[n.id] = []; parents[n.id] = []; });
      edges.forEach(function(e) {
        if (children[e.from]) children[e.from].push(e.to);
        if (parents[e.to]) parents[e.to].push(e.from);
      });
      var generation = {};
      var inDegree = {};
      nodes.forEach(function(n) { inDegree[n.id] = (parents[n.id] || []).length; });
      var queue = [];
      nodes.forEach(function(n) {
        if (inDegree[n.id] === 0) { queue.push(n.id); generation[n.id] = 0; }
      });
      var maxGen = 0;
      while (queue.length) {
        var cur = queue.shift();
        (children[cur] || []).forEach(function(child) {
          generation[child] = Math.max(generation[child] || 0, (generation[cur] || 0) + 1);
          maxGen = Math.max(maxGen, generation[child]);
          inDegree[child]--;
          if (inDegree[child] === 0) queue.push(child);
        });
      }
      // Assign lanes (y) — spread nodes at same generation vertically
      var nodesByGen = {};
      nodes.forEach(function(n) {
        var g = generation[n.id] !== undefined ? generation[n.id] : 0;
        if (!nodesByGen[g]) nodesByGen[g] = [];
        nodesByGen[g].push(n.id);
      });
      var lane = {};
      for (var g = 0; g <= maxGen; g++) {
        var ids = nodesByGen[g] || [];
        ids.forEach(function(id, i) {
          lane[id] = (i - (ids.length - 1) / 2) * 1.5;
        });
      }
      return { generation: generation, lane: lane, maxGen: maxGen };
    }

    function renderGraph(data) {
      var nodes = data.nodes;
      var edges = data.edges;
      var heads = data.heads || [];
      var headsSet = {};
      heads.forEach(function(h) { headsSet[h] = true; });

      var lay = computeLayout(data);
      var gen = lay.generation;
      var lane = lay.lane;

      // Separate edges by kind
      var parentEdges = [];
      var dependsOnEdges = [];
      edges.forEach(function(e) {
        if (e.kind === 'depends_on') { dependsOnEdges.push(e); }
        else { parentEdges.push(e); }
      });

      function makeEdgeTraces(edgeList, isDashed) {
        return edgeList.map(function(e) {
          return {
            x: [gen[e.from] || 0, gen[e.to] || 0],
            y: [lane[e.from] || 0, lane[e.to] || 0],
            mode: 'lines',
            line: {
              color: isDashed ? cssVar('--color-accent') : cssVar('--color'),
              width: isDashed ? 1.5 : 2,
              dash: isDashed ? 'dash' : 'solid'
            },
            hoverinfo: 'text',
            hovertext: (e.kind || 'parent') + ': ' + e.from + ' → ' + e.to,
            showlegend: false
          };
        });
      }

      var allEdgeTraces = makeEdgeTraces(parentEdges, false)
        .concat(makeEdgeTraces(dependsOnEdges, true));

      var regularNodes = nodes.filter(function(n) { return !headsSet[n.id]; });
      var headNodes = nodes.filter(function(n) { return headsSet[n.id]; });

      function makeNodeTrace(nodeList, isHead) {
        return {
          x: nodeList.map(function(n) { return gen[n.id] || 0; }),
          y: nodeList.map(function(n) { return lane[n.id] || 0; }),
          text: nodeList.map(function(n) { return n.label; }),
          textposition: 'bottom center',
          mode: 'markers+text',
          marker: {
            size: isHead ? 28 : 22,
            color: isHead ? cssVar('--color-accent') : cssVar('--color'),
            line: {
              color: isHead ? cssVar('--color-accent') : cssVar('--color-border'),
              width: isHead ? 3 : 1.5
            },
            symbol: isHead ? 'diamond' : 'circle'
          },
          textfont: { color: cssVar('--color-text'), size: 10 },
          hovertext: nodeList.map(function(n) {
            return '<b>Revision:</b> ' + n.id +
                   '<br><b>Message:</b> ' + (n.docstring || 'N/A') +
                   (isHead ? '<br><b>HEAD</b>' : '');
          }),
          hoverinfo: 'text',
          type: 'scatter',
          name: isHead ? 'Heads' : 'Migrations',
          showlegend: true
        };
      }

      var nodeTraces = [];
      if (regularNodes.length) nodeTraces.push(makeNodeTrace(regularNodes, false));
      if (headNodes.length) nodeTraces.push(makeNodeTrace(headNodes, true));

      // Legend entry for depends_on edges
      if (dependsOnEdges.length) {
        allEdgeTraces.push({
          x: [null], y: [null], mode: 'lines',
          line: { color: cssVar('--color-accent'), width: 1.5, dash: 'dash' },
          name: 'depends_on', showlegend: true
        });
      }

      var plotLayout = {
        title: {
          text: 'Migration Chain (Heads: ' + heads.join(', ') + ')',
          font: { color: cssVar('--color-text') }
        },
        paper_bgcolor: cssVar('--color-bg'),
        plot_bgcolor: cssVar('--color-bg'),
        font: { color: cssVar('--color-text') },
        xaxis: {
          showgrid: false, zeroline: false, showticklabels: false,
          title: { text: 'generation ->', font: { color: cssVar('--color-text-secondary'), size: 10 } }
        },
        yaxis: { showgrid: false, zeroline: false, showticklabels: false },
        margin: { l: 40, r: 40, t: 60, b: 100 },
        hovermode: 'closest',
        legend: {
          font: { color: cssVar('--color-text') },
          bgcolor: cssVar('--color-bg'),
          bordercolor: cssVar('--color-border')
        }
      };

      Plotly.newPlot('graph', allEdgeTraces.concat(nodeTraces), plotLayout, { responsive: true });
    }

    function loadGraph() {
      if (typeof EMBEDDED_GRAPH_DATA !== 'undefined') {
        renderGraph(EMBEDDED_GRAPH_DATA);
        return;
      }
      fetch(GRAPH_API)
        .then(function(r) { return r.json(); })
        .then(function(data) { renderGraph(data); })
        .catch(function(err) { showError('Failed to load graph: ' + err.message); });
    }

    function computeRollback() {
      var target = document.getElementById('rollback-target').value.trim();
      if (!target) {
        showError('Please enter a target revision.');
        return;
      }
      var resultEl = document.getElementById('rollback-result');
      fetch(ROLLBACK_API + encodeURIComponent(target))
        .then(function(r) {
          if (!r.ok) {
            return r.json().then(function(d) { throw new Error(d.detail); });
          }
          return r.json();
        })
        .then(function(data) {
          resultEl.style.display = 'block';
          resultEl.textContent = '';

          var h3 = document.createElement('h3');
          h3.textContent = 'Rollback to ' + target;
          resultEl.appendChild(h3);

          var steps = (data.downgrade_steps || []).join(' -> ');
          var p = document.createElement('p');
          var strong = document.createElement('strong');
          strong.textContent = steps || '(already at target)';
          p.appendChild(document.createTextNode('Sequence: '));
          p.appendChild(strong);
          resultEl.appendChild(p);

          var cmds = (data.commands || []).join('\n');
          var pre = document.createElement('pre');
          pre.textContent = cmds || '(no steps needed)';
          resultEl.appendChild(pre);
        })
        .catch(function(err) {
          showError(err.message);
        });
    }

    document.getElementById('btn-refresh').addEventListener('click', loadGraph);
    document.getElementById('btn-rollback').addEventListener('click', computeRollback);

    // Load graph on page open
    loadGraph();
  </script>
</body>
</html>
